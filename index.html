<!DOCTYPE html>

    <style>
        .header{
            background-color: rgb(224, 214, 214);
            display: flex;
            justify-content: space-between;
            height: 100px;
            width: 100%;
            align-items: center;
        }

        .header1{
            font-size: 32px;
            font-weight: bold;
            color: #26365c;
            padding: 20px;
        }

        .header1 i{
            color: rgb(47, 168, 47);
        }

        .search{
            display: flex;
            width: 370px;
            height: 54px;
            
        }

        .search input{
            border-radius: 3px;
            border: none;
            padding: 14px;
            font-size: 18px;
        }

        .search button{
            width: 60px;
            border: none;
            border-radius: 3px;
            background-color: rgb(45, 221, 45);
            color: white;
            font-size: 25px;
        }

        .menubar{
            min-height: 74px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 15px 20px;
            gap: 20px;
            background: white;
            border-bottom: 1px solid #ddd;
        }
        .menu {
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px;
       
        }

        .menu a{
             text-decoration: none;
             color: black;
             font-size: 20px;
        }
        .menu a:hover {
            color: #27ae60;
        }

        .icons {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .icons i {
            color: #26365c;
            font-size: 28px;
            text-decoration: none;
        }

        .icons i:hover {
            color: #27ae60;
        }

        .imgtext{
            display: flex;
            flex-wrap: wrap;
            
            width: 100%;
            height: 500px;

        .img{
            height: 500px;
            padding: 20px;
        }
        .img img{
            height: 500px;
            width: 100%;
        }

        .text{
            width: 35%;
            margin-top: 130px;
            
        
            
        }

        .banners{
            display: flex;
            justify-content: center;
            width: 95%;
            gap: 5px;
            margin-left: 20px;

        .banner1 img{
            width: 100%;
        }
         .banner2  img{

        .text span{

         color: rgb(151, 149, 149);

        .text h3{
            font-size: 32px;
            margin-top: -2px;

        .text button{
            background-color: #27ae60;
            padding: 8px;
            border: none;
            margin-top: -10px;

            justify-content: center;
            width: 100%;
            gap: 10px;
            margin-left: 20px;

        .banner1 img{
            width: 100%;
            height: 230px;

        .banner1{
            width: 46%;

        .banner1 .content{
            position: absolute;
            top: 150%;
            left: 8%;

        .content h3{
            font-size: 25px;
        }
        .content p{
            font-size: 21px;
            margin-top: -20px;

            color: white;

        .banner2{

            height: 230px;

            top: 150%;
            left: 56%;

        .boxs{

            justify-content: center;
            width: 100%;
            height: 380px;
            border: black;
            gap: 10px;

          width: 23%;

         border: black;

        .box img{

            height: 200px;
            margin: auto;

      text-align: center;

            padding: 6px;

            font-size: 22px;

            border: none;
            border-color: white;
            border-radius: 4px;

            width: 100%;
            height: 380px;
            border: black;
            
            
        }
        .boxs .box{

}
 @media (min-width: 1180px) and (max-width: 1700px){

 }
